---
title: Mimikatz Usage Detection
id: sigma-001
status: stable
description: Detects Mimikatz credential dumping via command-line arguments
references:
  - https://attack.mitre.org/techniques/T1003/
tags:
  - attack.credential_access
  - attack.t1003
author: CyberRemedy
date: 2024/01/01
logsource: {category: process_creation, product: windows}
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'kerberos::'
      - 'lsadump::'
      - 'privilege::debug'
      - 'crypto::certificates'
  condition: selection
falsepositives:
  - Penetration testing
level: critical
---
title: PowerShell Encoded Command Execution
id: sigma-002
status: stable
description: Detects PowerShell with encoded commands (common malware technique)
tags:
  - attack.execution
  - attack.t1059.001
author: CyberRemedy
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
  filter:
    CommandLine|contains: 'SCCM'
  condition: selection and not filter
level: high
---
title: Suspicious Scheduled Task Creation
id: sigma-003
status: stable
description: Detects scheduled task creation for persistence
tags:
  - attack.persistence
  - attack.t1053.005
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains:
      - '/create'
      - '/sc onlogon'
      - '/sc onstart'
      - '/ru system'
  condition: selection
level: high
---
title: Net User Discovery
id: sigma-004
status: stable
description: Attacker enumerating local and domain users
tags:
  - attack.discovery
  - attack.t1087
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith: '\net.exe'
    CommandLine|contains:
      - 'user /domain'
      - 'localgroup administrators'
      - 'group "domain admins"'
      - 'accounts /dom'
  condition: selection
level: medium
---
title: WMI Execution for Lateral Movement
id: sigma-005
status: stable
description: WMI used for remote command execution
tags:
  - attack.lateral_movement
  - attack.t1047
logsource: {category: process_creation, product: windows}
detection:
  selection:
    Image|endswith: '\wmic.exe'
    CommandLine|contains:
      - '/node:'
      - 'process call create'
  condition: selection
level: high
---
title: LSASS Memory Access
id: sigma-006
status: stable
description: Suspicious access to LSASS process memory (credential dumping)
tags:
  - attack.credential_access
  - attack.t1003.001
logsource: {category: process_access, product: windows}
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|contains:
      - '0x1010'
      - '0x1410'
      - '0x147a'
      - '0x143a'
  condition: selection
level: critical
---
title: Shadow Copy Deletion
id: sigma-007
status: stable
description: Ransomware/attacker deleting shadow copies to prevent recovery
tags:
  - attack.impact
  - attack.t1490
logsource: {category: process_creation, product: windows}
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains: 'delete shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains: 'shadowcopy delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains: 'delete catalog'
  condition: 1 of selection_*
level: critical
---
title: Suspicious Registry AutoRun Key
id: sigma-008
status: stable
description: Executable added to registry Run key for persistence
tags:
  - attack.persistence
  - attack.t1547.001
logsource: {category: registry_set, product: windows}
detection:
  selection:
    TargetObject|contains:
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
      - '\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
    Details|endswith:
      - '.exe'
      - '.bat'
      - '.vbs'
      - '.ps1'
  condition: selection
level: high
---
