title: Abnormal DNS Query Length
id: sigma-021
status: stable
description: Unusually long DNS query — possible DNS tunneling
tags:
  - attack.exfiltration
  - attack.t1048.003
logsource: {category: dns}
detection:
  selection:
    dns_query|contains: '.'
    dns_query|re: '^[a-zA-Z0-9]{40,}\.'
