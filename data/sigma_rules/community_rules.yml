---
title: Disable Windows Firewall
id: sigma-022
status: stable
description: Windows Firewall disabled via netsh or PowerShell
tags:
  - attack.defense_evasion
  - attack.t1562.004
logsource: {category: process_creation, product: windows}
detection:
  selection_netsh:
    Image|endswith: '\netsh.exe'
    CommandLine|contains:
      - 'advfirewall set allprofiles state off'
      - 'firewall set opmode mode=disable'
  selection_ps:
    CommandLine|contains:
      - 'Set-NetFirewallProfile'
      - '-Enabled False'
  condition: 1 of selection_*
level: high
