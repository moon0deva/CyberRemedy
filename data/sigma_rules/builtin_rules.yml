# CyberRemedy Built-in Sigma Rules v2.0
rules:
  - id: SIG-001
    title: Port Scan Detected
    severity: MEDIUM
    mitre_id: T1046
    category: network
    description: Multiple destination ports probed from single source within short window
    detection:
      unique_dst_ports: 10
      window_seconds: 60

  - id: SIG-002
    title: SSH Brute Force
    severity: HIGH
    mitre_id: T1110.001
    category: network
    description: Repeated SSH connection attempts from same source IP
    detection:
      dst_port: 22
      attempts: 5
      window_seconds: 30

  - id: SIG-003
    title: DNS Exfiltration Attempt
    severity: HIGH
    mitre_id: T1048.003
    category: network
    description: Abnormally long DNS query suggesting data exfiltration via DNS tunnel
    detection:
      protocol: DNS
      query_length: 100

  - id: SIG-004
    title: Cleartext Password Transmission
    severity: HIGH
    mitre_id: T1040
    category: network
    description: Credentials sent over unencrypted protocols (FTP, Telnet, HTTP)
    detection:
      dst_port: [21, 23, 80]

  - id: SIG-005
    title: RDP Brute Force
    severity: HIGH
    mitre_id: T1110.001
    category: network
    description: Multiple failed RDP login attempts from single source
    detection:
      dst_port: 3389
      attempts: 3
      window_seconds: 60

  - id: SIG-006
    title: SMB Lateral Movement
    severity: CRITICAL
    mitre_id: T1021.002
    category: network
    description: SMB connections to multiple internal hosts suggesting lateral movement
    detection:
      dst_port: [445, 139]
      unique_dst_ips: 3
      window_seconds: 120

  - id: SIG-007
    title: Outbound Connection on Non-standard Port
    severity: LOW
    mitre_id: T1571
    category: network
    description: Outbound TCP connection to non-standard high port
    detection:
      direction: outgoing
      dst_port_min: 49152
      dst_port_max: 65535

  - id: SIG-008
    title: ICMP Flood
    severity: MEDIUM
    mitre_id: T1498.001
    category: network
    description: Large volume of ICMP packets from single source (ping flood)
    detection:
      protocol: ICMP
      count: 50
      window_seconds: 10

  - id: SIG-009
    title: Telnet Access Attempt
    severity: MEDIUM
    mitre_id: T1021.004
    category: network
    description: Telnet connection attempt (insecure remote access)
    detection:
      dst_port: 23

  - id: SIG-010
    title: FTP Login Attempt
    severity: LOW
    mitre_id: T1021.005
    category: network
    description: FTP authentication attempt detected
    detection:
      dst_port: 21

  - id: SIG-011
    title: MySQL Unauthorized Access
    severity: HIGH
    mitre_id: T1190
    category: network
    description: Connection attempt to MySQL from external source
    detection:
      dst_port: 3306
      direction: incoming

  - id: SIG-012
    title: HTTP Directory Traversal
    severity: HIGH
    mitre_id: T1083
    category: network
    description: HTTP request containing directory traversal pattern
    detection:
      dst_port: 80
      payload_pattern: "../"

  - id: SIG-013
    title: Large Data Exfiltration
    severity: CRITICAL
    mitre_id: T1041
    category: network
    description: Unusually large outbound data transfer suggesting exfiltration
    detection:
      direction: outgoing
      bytes_min: 10485760

  - id: SIG-014
    title: Tor Exit Node Communication
    severity: CRITICAL
    mitre_id: T1090.003
    category: network
    description: Traffic to known Tor exit node IP ranges
    detection:
      dst_port: [9001, 9030, 9050, 9051]

  - id: SIG-015
    title: C2 Beacon Pattern
    severity: CRITICAL
    mitre_id: T1071.001
    category: network
    description: Periodic outbound connections at regular intervals suggesting C2 beaconing
    detection:
      direction: outgoing
      periodic: true
      interval_seconds: 60

  - id: SIG-016
    title: Internal Host Scan
    severity: MEDIUM
    mitre_id: T1018
    category: network
    description: Single host scanning multiple internal IPs (network discovery)
    detection:
      unique_dst_ips: 20
      window_seconds: 60
      dst_private: true

  - id: SIG-017
    title: LDAP Enumeration
    severity: MEDIUM
    mitre_id: T1087.002
    category: network
    description: LDAP queries suggesting Active Directory enumeration
    detection:
      dst_port: [389, 636, 3268, 3269]

  - id: SIG-018
    title: NTP Amplification DDoS
    severity: HIGH
    mitre_id: T1498.002
    category: network
    description: NTP monlist requests used in amplification attacks
    detection:
      dst_port: 123
      protocol: UDP
      count: 20

  - id: SIG-019
    title: Credential Dumping via LSASS
    severity: CRITICAL
    mitre_id: T1003.001
    category: process
    description: Network traffic pattern consistent with credential dumping tools
    detection:
      dst_port: [445, 135]
      rapid_sequence: true

  - id: SIG-020
    title: Suspicious PowerShell Download
    severity: HIGH
    mitre_id: T1059.001
    category: network
    description: HTTP GET to known script hosting sites from internal host
    detection:
      direction: outgoing
      dst_port: [80, 443]
      payload_pattern: "powershell"


---
title: PowerShell Encoded Command Execution
id: cr-sigma-001
status: stable
description: Detects PowerShell execution with encoded command parameter
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains|any:
            - ' -enc '
            - ' -EncodedCommand '
            - ' -e '
    filter:
        CommandLine|contains: 'AAAA'
    condition: selection and not filter
level: high
tags:
    - attack.execution
    - attack.t1059.001
---
title: Mimikatz Command Line Indicators
id: cr-sigma-002
status: stable
description: Detects Mimikatz usage via command-line arguments
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains|any:
            - 'sekurlsa::logonpasswords'
            - 'lsadump::sam'
            - 'lsadump::dcsync'
            - 'privilege::debug'
            - 'kerberos::list'
            - 'kerberos::ptt'
            - 'kerberos::golden'
    condition: selection
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
---
title: LSASS Memory Access via Process Handle
id: cr-sigma-003
status: stable
description: Detects access to LSASS process memory for credential dumping
logsource:
    category: process_access
    product: windows
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains|any:
            - '0x1010'
            - '0x1410'
            - '0x147a'
            - '0x143a'
    filter:
        SourceImage|contains|any:
            - '\Windows\System32\'
            - '\Windows\SysWOW64\'
    condition: selection and not filter
level: critical
tags:
    - attack.credential_access
    - attack.t1003.001
---
title: Scheduled Task Creation via Schtasks
id: cr-sigma-004
status: stable
description: Detects suspicious scheduled task creation
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    suspicious:
        CommandLine|contains|any:
            - 'powershell'
            - 'cmd.exe /c'
            - 'wscript'
            - 'regsvr32'
            - 'mshta'
            - 'rundll32'
    condition: selection and suspicious
level: high
tags:
    - attack.persistence
    - attack.t1053.005
---
title: Net User Add Command
id: cr-sigma-005
status: stable
description: Detects local user account creation
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\net.exe'
        CommandLine|contains|all:
            - 'user'
            - '/add'
    condition: selection
level: high
tags:
    - attack.persistence
    - attack.t1136.001
---
title: PsExec Remote Execution
id: cr-sigma-006
status: stable
description: Detects PsExec usage for remote command execution
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith|any:
            - '\psexec.exe'
            - '\psexec64.exe'
            - '\PsExec.exe'
    condition: selection
level: high
tags:
    - attack.lateral_movement
    - attack.t1021.002
---
title: Windows Admin Share Access
id: cr-sigma-007
status: stable
description: Detects access to Windows admin shares (C$, ADMIN$, IPC$)
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 5140
        ShareName|contains|any:
            - '\\ADMIN$'
            - '\\C$'
            - '\\IPC$'
    condition: selection
level: medium
tags:
    - attack.lateral_movement
    - attack.t1021.002
---
title: Suspicious Certutil Usage
id: cr-sigma-008
status: stable
description: Detects certutil used for download or encode/decode operations
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains|any:
            - '-urlcache'
            - '-decode'
            - '-encode'
            - '-decodehex'
    condition: selection
level: high
tags:
    - attack.defense_evasion
    - attack.t1027
---
title: Regsvr32 Squiblydoo
id: cr-sigma-009
status: stable
description: Detects Squiblydoo - regsvr32 used to execute COM scriptlets
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\regsvr32.exe'
        CommandLine|contains|any:
            - '/i:http'
            - '/i:https'
            - '/i:ftp'
            - 'scrobj'
    condition: selection
level: high
tags:
    - attack.defense_evasion
    - attack.t1218.010
---
title: Shadow Copy Deletion
id: cr-sigma-010
status: stable
description: Detects deletion of volume shadow copies - common in ransomware
logsource:
    category: process_creation
    product: windows
detection:
    selection_vssadmin:
        Image|endswith: '\vssadmin.exe'
        CommandLine|contains|all:
            - 'delete'
            - 'shadows'
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'shadowcopy'
            - 'delete'
    condition: selection_vssadmin or selection_wmic
level: critical
tags:
    - attack.impact
    - attack.t1490
---
title: Whoami Execution
id: cr-sigma-011
status: stable
description: Detects whoami command execution - common in post-exploitation
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\whoami.exe'
    filter:
        ParentImage|contains:
            - '\System32\'
    condition: selection and not filter
level: low
tags:
    - attack.discovery
    - attack.t1033
---
title: Linux Reverse Shell
id: cr-sigma-012
status: stable
description: Detects common reverse shell one-liners on Linux
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains|any:
            - 'bash -i >& /dev/tcp/'
            - '/bin/bash -c bash'
            - 'exec 5<>/dev/tcp/'
            - 'python -c import socket'
            - 'python3 -c import socket'
            - 'perl -e use Socket'
            - '0>&1'
            - 'nc -e /bin/bash'
            - 'nc -e /bin/sh'
            - 'ncat -e /bin/bash'
    condition: selection
level: critical
tags:
    - attack.execution
    - attack.t1059.004
---
title: Crontab Modification
id: cr-sigma-013
status: stable
description: Detects crontab modification for persistence
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains|any:
            - 'crontab -e'
            - 'echo * * * *'
            - '/etc/cron'
    condition: selection
level: medium
tags:
    - attack.persistence
    - attack.t1053.003
---
title: Sudo Privilege Escalation Attempt
id: cr-sigma-014
status: stable
description: Detects common sudo privilege escalation techniques
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains|any:
            - 'sudo -l'
            - 'sudo su'
            - 'sudo /bin/bash'
            - 'sudo /bin/sh'
            - 'sudo bash'
    condition: selection
level: medium
tags:
    - attack.privilege_escalation
    - attack.t1548.003
---
title: SUID Binary Execution
id: cr-sigma-015
status: stable
description: Detects execution of SUID binaries for privilege escalation
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains|any:
            - 'find / -perm -4000'
            - 'find / -perm -u=s'
            - '/usr/bin/python'
            - '/usr/bin/nmap --interactive'
    condition: selection
level: high
tags:
    - attack.privilege_escalation
    - attack.t1548
---
title: Base64 Encoded Payload Execution
id: cr-sigma-016
status: stable
description: Detects base64 decode and execute patterns on Linux
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        CommandLine|contains|any:
            - 'base64 -d'
            - 'base64 --decode'
            - '| base64 -d |'
            - 'echo.*base64.*|.*bash'
    condition: selection
level: high
tags:
    - attack.defense_evasion
    - attack.t1027
---
title: Network Port Scan Detection
id: cr-sigma-017
status: stable
description: Detects network port scanning tools
logsource:
    category: process_creation
    product: linux
detection:
    selection:
        Image|contains|any:
            - 'nmap'
            - 'masscan'
            - 'zmap'
            - 'unicornscan'
    condition: selection
level: medium
tags:
    - attack.discovery
    - attack.t1046
---
title: Outbound DNS Tunneling
id: cr-sigma-018
status: stable
description: Detects DNS tunneling tools
logsource:
    category: process_creation
detection:
    selection:
        Image|contains|any:
            - 'iodine'
            - 'dnscat'
            - 'dns2tcp'
            - 'dnschef'
    condition: selection
level: high
tags:
    - attack.command_and_control
    - attack.t1071.004
---
title: Mshta Suspicious Execution
id: cr-sigma-019
status: stable
description: Detects mshta executing scripts from remote URLs
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\mshta.exe'
        CommandLine|contains|any:
            - 'http://'
            - 'https://'
            - 'vbscript:'
            - 'javascript:'
    condition: selection
level: high
tags:
    - attack.defense_evasion
    - attack.t1218.005
---
title: WMI Lateral Movement
id: cr-sigma-020
status: stable
description: Detects WMI used for lateral movement or remote execution
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|any:
            - '/node:'
            - 'process call create'
    condition: selection
level: high
tags:
    - attack.lateral_movement
    - attack.t1047
