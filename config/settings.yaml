assets:
  db_path: data/assets/inventory.json
  enabled: true
  labels: {}
  port_scan_new_devices: true
  port_scan_ports:
  - 22
  - 80
  - 443
  - 3389
  - 445
  - 21
  - 23
  - 3306
  - 5432
  - 8080
  - 8443
  rogue_device_alert: true
  scan_interval_seconds: 300
  scan_on_startup: true
capture:
  flow_timeout_seconds: 60
  interface: auto
  live_enabled: true
  max_packets_buffer: 10000
  pcap_dir: data/pcap
  pcap_max_file_size_mb: 500
  pcap_max_total_gb: 20
  pcap_retention_days: 30
  pcap_save_enabled: false
  simulation_rate: 20
deployment:
  name: CyberRemedy Node
  profile: laptop
detection:
  anomaly:
    classifier_path: models/rf_attack_model.joblib
    contamination: 0.05
    model_path: models/anomaly_model.joblib
    retrain_on_startup: false
  correlation:
    chain_min_events: 2
    fp_reduction: true
    time_window_seconds: 300
  signature:
    brute_force_threshold: 10
    c2_beacon_interval_ms: 30000
    dns_entropy_threshold: 3.8
    port_scan_threshold: 15
  threshold: 70
firewall:
  backend: auto
  chain_name: CYBERREMEDY
  dry_run: false
  enabled: true
  webhook_api_key: ''
  webhook_enabled: false
  webhook_url: ''
  windows_rule_prefix: CYBERREMEDY-Block-
geoip:
  block_high_risk: false
  enabled: true
  fallback: online
  high_risk_countries:
  - CN
  - RU
  - KP
  - IR
  - BY
  - CU
  - SY
logging:
  base_dir: data/logs
  compress_old: true
  max_total_gb: 50
  retention_days: 365
  rotate_daily: true
network:
  exclude_ips: []
  monitored_subnets: auto
  trusted_ips: []
notifications:
  browser_push: true
  daily_report_hour: 8
  discord_enabled: false
  discord_webhook: ''
  email: ''
  notify_severities:
  - CRITICAL
  - HIGH
  scheduled_reports: false
  slack_enabled: false
  slack_webhook: ''
  telegram_bot_token: ''
  telegram_chat_id: ''
  telegram_enabled: false
response:
  auto_block: false
  auto_block_critical: true
  auto_block_high: false
  auto_block_medium: false
  auto_block_threshold: 85
  blocked_ip_ttl_seconds: 3600
  dry_run: false
  notify_on_block: true
  rollback_enabled: true
scoring:
  critical_threshold: 80
  high_threshold: 60
  low_threshold: 0
  medium_threshold: 40
siem:
  active_bpf: ''
  active_iface: wlan0
  active_method: auto
  active_targets: []
  capture_mode: active
  connected_iface: wlan0
  db_path: data/siem_devices.json
  discovery_interval: 30
  enabled: true
  gateway_ip: ''
  interface: wlan1
  quic:
    block_quic: true
    enabled: false
    target_ips: []
  spike_threshold: 50
  spike_window: 10
  tls:
    enabled: false
    intercept_http: true
    intercept_https: true
    mode: transparent
    proxy_port: 8080
    target_ips: []
    wpad_port: 8088
  vpn_inspect:
    block_protocols: []
    block_vpn: false
    enabled: false
    target_ips: []
system:
  interface: auto
  log_level: INFO
  offline_mode: true
  version: 1.2.0
