version: 1.0
description: >
  Fully automated credential compromise incident response.
  Triggered by CyberRemedy when a high-risk authentication anomaly is detected.
  Performs enrichment, geo validation, user disablement, session revocation,
  IP blocking, case creation, and auto-closure — zero analyst interaction.

input:
  - alert_id
  - user_id
  - host_id
  - source_ip
  - destination_ip
  - file_hash
  - process_name
  - risk_score
  - geo_location
  - timestamp

vars:
  risk_level: ""
  threat_score: 0
  final_action: "none"
  user_context: {}
  geo_valid: true
  impossible_travel: false
  privilege_escalation: false
  case_id: ""
  execution_log: []

tasks:
  evaluate_risk:
    action: core.noop
    publish:
      risk_level: >
        <% if ctx().risk_score > 90 %>full_containment<% elif ctx().risk_score >= 70 %>conditional<% else %>exit<% endif %>
    next:
      - when: <% ctx().risk_level = "exit" %>
        do: log_no_action
      - when: <% ctx().risk_level in ["full_containment", "conditional"] %>
        do:
          - enrich_threat_intel
          - get_user_context

  # ── Parallel enrichment ──────────────────────────────────────────────────────
  enrich_threat_intel:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json, sys
        from pathlib import Path
        ioc_file = Path('data/ioc_store.json')
        ip = '{{ ctx().source_ip }}'
        result = {'ip': ip, 'is_malicious': False, 'threat_score': 0, 'tags': []}
        if ioc_file.exists():
            data = json.loads(ioc_file.read_text())
            ips = data.get('ips', {})
            if ip in ips:
                r = ips[ip]
                result['is_malicious'] = True
                result['threat_score'] = 90
                result['tags'] = r.get('tags', [])
        print(json.dumps(result))
        "
    retry:
      count: 3
      delay: 5
    publish:
      threat_score: <% int(result().stdout | fromjson | get("threat_score", 0)) %>
      ioc_malicious: <% result().stdout | fromjson | get("is_malicious", false) %>
    next:
      - do: check_impossible_travel

  get_user_context:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json
        from pathlib import Path
        uid = '{{ ctx().user_id }}'
        users = Path('data/users.json')
        ctx = {'user_id': uid, 'found': False, 'role': 'unknown', 'active': True}
        if users.exists():
            data = json.loads(users.read_text())
            for u in data:
                if u.get('username') == uid or u.get('id') == uid:
                    ctx = {**ctx, 'found': True, 'role': u.get('role','user'), 'active': True}
        print(json.dumps(ctx))
        "
    retry:
      count: 3
      delay: 5
    publish:
      user_context: <% result().stdout | fromjson %>
    next:
      - do: validate_geo

  validate_geo:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json
        from pathlib import Path
        ip = '{{ ctx().source_ip }}'
        geo = '{{ ctx().geo_location }}'
        geoip_file = Path('data/geoip/ip_country.json')
        result = {'geo_ok': True, 'detected_country': 'unknown'}
        if geoip_file.exists():
            import ipaddress
            ip_int = int(ipaddress.ip_address(ip.split('/')[0]))
            data = json.loads(geoip_file.read_text())
            for entry in data:
                if int(entry['start']) <= ip_int <= int(entry['end']):
                    result['detected_country'] = entry.get('country','unknown')
                    break
            if geo and result['detected_country'] not in ['unknown','']:
                result['geo_ok'] = geo.upper() == result['detected_country'].upper()
        print(json.dumps(result))
        "
    publish:
      geo_valid: <% result().stdout | fromjson | get("geo_ok", true) %>
    next:
      - do: check_impossible_travel

  # ── Correlation ──────────────────────────────────────────────────────────────
  check_impossible_travel:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json, re
        from pathlib import Path
        ip = '{{ ctx().source_ip }}'
        uid = '{{ ctx().user_id }}'
        ts = '{{ ctx().timestamp }}'
        log_file = Path('data/logs.json')
        result = {'impossible_travel': False, 'prev_location': 'unknown'}
        if log_file.exists():
            try:
                logs = json.loads(log_file.read_text())
                user_logs = [l for l in logs[-1000:] if l.get('user') == uid and l.get('src_ip') != ip]
                if len(user_logs) > 0:
                    last = user_logs[-1]
                    result['prev_ip'] = last.get('src_ip','')
                    result['impossible_travel'] = result['prev_ip'] != '' and result['prev_ip'] != ip
            except Exception:
                pass
        print(json.dumps(result))
        "
    publish:
      impossible_travel: <% result().stdout | fromjson | get("impossible_travel", false) %>
    next:
      - do: check_privilege_escalation

  check_privilege_escalation:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json
        from pathlib import Path
        uid = '{{ ctx().user_id }}'
        alert_file = Path('data/cases.json')
        result = {'privilege_escalation': False}
        if alert_file.exists():
            try:
                cases = json.loads(alert_file.read_text())
                priv_cases = [c for c in cases if
                    c.get('entity') == uid and
                    any(t in c.get('title','').lower() for t in ['priv','escalat','admin','sudo','root'])
                ]
                result['privilege_escalation'] = len(priv_cases) > 0
            except Exception:
                pass
        print(json.dumps(result))
        "
    publish:
      privilege_escalation: <% result().stdout | fromjson | get("privilege_escalation", false) %>
    next:
      - do: decide_action

  # ── Decision ─────────────────────────────────────────────────────────────────
  decide_action:
    action: core.noop
    publish:
      final_action: >
        <% if ctx().risk_level = "full_containment" or ctx().impossible_travel or ctx().privilege_escalation or ctx().ioc_malicious %>contain<% else %>monitor<% endif %>
    next:
      - when: <% ctx().final_action = "contain" %>
        do:
          - disable_user
          - block_source_ip
      - when: <% ctx().final_action = "monitor" %>
        do: create_case

  # ── Response — parallel execution ─────────────────────────────────────────────
  disable_user:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json
        from pathlib import Path
        uid = '{{ ctx().user_id }}'
        users_file = Path('data/users.json')
        result = {'disabled': False, 'user': uid}
        if users_file.exists():
            try:
                users = json.loads(users_file.read_text())
                for u in users:
                    if u.get('username') == uid:
                        u['active'] = False
                        u['disabled_reason'] = 'SOAR: credential_compromise'
                        result['disabled'] = True
                users_file.write_text(json.dumps(users, indent=2))
            except Exception as e:
                result['error'] = str(e)
        print(json.dumps(result))
        "
    retry:
      count: 3
      delay: 5
    publish:
      user_disabled: <% result().stdout | fromjson | get("disabled", false) %>
    next:
      - do: revoke_sessions

  revoke_sessions:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json
        from pathlib import Path
        from datetime import datetime, timezone
        uid = '{{ ctx().user_id }}'
        revoke_log = Path('data/revoked_sessions.json')
        existing = []
        if revoke_log.exists():
            try: existing = json.loads(revoke_log.read_text())
            except: pass
        existing.append({'user': uid, 'revoked_at': datetime.now(timezone.utc).isoformat(),
                         'reason': 'SOAR:credential_compromise', 'alert_id': '{{ ctx().alert_id }}'})
        revoke_log.write_text(json.dumps(existing[-500:], indent=2))
        print(json.dumps({'revoked': True, 'user': uid}))
        "
    publish:
      sessions_revoked: <% result().stdout | fromjson | get("revoked", false) %>
    next:
      - do: create_case

  block_source_ip:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import subprocess, json, ipaddress
        ip = '{{ ctx().source_ip }}'
        result = {'blocked': False, 'ip': ip}
        try:
            ipt = 'ip6tables' if ipaddress.ip_address(ip).version == 6 else 'iptables'
            r = subprocess.run([ipt, '-I', 'INPUT', '-s', ip, '-j', 'DROP'],
                               capture_output=True, text=True, timeout=10)
            result['blocked'] = r.returncode == 0
            result['cmd_out'] = r.stderr.strip()
        except Exception as e:
            result['error'] = str(e)
        print(json.dumps(result))
        "
    retry:
      count: 3
      delay: 5
    publish:
      ip_blocked: <% result().stdout | fromjson | get("blocked", false) %>
    next:
      - do: create_case

  # ── Case management ───────────────────────────────────────────────────────────
  create_case:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json, uuid
        from pathlib import Path
        from datetime import datetime, timezone
        cases_file = Path('data/cases.json')
        existing = []
        if cases_file.exists():
            try: existing = json.loads(cases_file.read_text())
            except: pass
        case_id = 'CASE-CRED-' + uuid.uuid4().hex[:8].upper()
        case = {
            'id': case_id, 'type': 'credential_compromise',
            'alert_id': '{{ ctx().alert_id }}', 'user_id': '{{ ctx().user_id }}',
            'source_ip': '{{ ctx().source_ip }}', 'risk_score': {{ ctx().risk_score }},
            'final_action': '{{ ctx().final_action }}',
            'impossible_travel': {{ ctx().impossible_travel }},
            'privilege_escalation': {{ ctx().privilege_escalation }},
            'created_at': datetime.now(timezone.utc).isoformat(),
            'status': 'OPEN', 'playbook': 'credential_compromise_response'
        }
        existing.append(case)
        cases_file.write_text(json.dumps(existing, indent=2))
        print(json.dumps({'case_id': case_id, 'created': True}))
        "
    publish:
      case_id: <% result().stdout | fromjson | get("case_id", "") %>
    next:
      - do: close_case

  close_case:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json
        from pathlib import Path
        from datetime import datetime, timezone
        cases_file = Path('data/cases.json')
        case_id = '{{ ctx().case_id }}'
        if cases_file.exists():
            cases = json.loads(cases_file.read_text())
            for c in cases:
                if c.get('id') == case_id:
                    c['status'] = 'AUTO_CLOSED'
                    c['closed_at'] = datetime.now(timezone.utc).isoformat()
                    c['resolution'] = 'Automated response executed: {{ ctx().final_action }}'
            cases_file.write_text(json.dumps(cases, indent=2))
        print(json.dumps({'closed': True, 'case_id': case_id}))
        "
    next:
      - do: log_results

  # ── Logging ───────────────────────────────────────────────────────────────────
  log_results:
    action: core.local
    input:
      cmd: >
        python3 -c "
        import json
        from pathlib import Path
        from datetime import datetime, timezone
        log_file = Path('data/soar_executions.json')
        existing = []
        if log_file.exists():
            try: existing = json.loads(log_file.read_text())
            except: pass
        existing.append({
            'playbook': 'credential_compromise_response',
            'alert_id': '{{ ctx().alert_id }}', 'user_id': '{{ ctx().user_id }}',
            'risk_score': {{ ctx().risk_score }}, 'final_action': '{{ ctx().final_action }}',
            'case_id': '{{ ctx().case_id }}', 'executed_at': datetime.now(timezone.utc).isoformat()
        })
        log_file.write_text(json.dumps(existing[-1000:], indent=2))
        print('logged')
        "
    next:
      - do: end

  log_no_action:
    action: core.local
    input:
      cmd: echo "Risk score {{ ctx().risk_score }} below threshold — no action taken for alert {{ ctx().alert_id }}"
    next:
      - do: end

  end:
    action: core.noop
